<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs Directory — KuroLabs AI</title>
  <meta name="description" content="Explore standalone software programs developed by KuroLabs, including KuroCodeAgent and upcoming autonomous tools.">
  <meta name="keywords" content="KuroLabs programs, KuroCodeAgent, KuroSentinel, KuroFlow, autonomous agents">
  <meta name="author" content="KuroLabs AI">
  <meta name="theme-color" content="#070909">
  <link rel="canonical" href="https://kurolabs-ai.github.io/programs/">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KuroLabs AI">
  <meta property="og:url" content="https://kurolabs-ai.github.io/programs/">
  <meta property="og:title" content="Programs Directory — KuroLabs AI">
  <meta property="og:description" content="Explore standalone software programs developed by KuroLabs, including KuroCodeAgent and upcoming autonomous tools.">
  <meta property="og:image" content="https://kurolabs-ai.github.io/assets/favicon.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Programs Directory — KuroLabs AI">
  <meta name="twitter:description" content="Explore standalone software programs developed by KuroLabs, including KuroCodeAgent and upcoming autonomous tools.">
  <meta name="twitter:image" content="https://kurolabs-ai.github.io/assets/favicon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#070909',
            surface: { DEFAULT: '#0d1211', hover: '#121a17' },
            accent: { DEFAULT: '#00e5b0', hover: '#22f5c5' },
            text: '#f3f6f5',
            muted: '#9aa9a3',
            dim: '#5c6a65',
            border: { DEFAULT: '#24312d', hover: '#384d46' },
            warning: '#f5c451',
            danger: '#ff6868'
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', '"Cascadia Code"', '"JetBrains Mono"', 'SFMono-Regular', '"Segoe UI Mono"', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-bg text-text bg-tech-grid min-h-screen flex flex-col">

  <!-- Navbar Mount -->
  <div id="navbar-mount"></div>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
    
    <!-- Directory Header -->
    <div class="max-w-3xl mb-12 space-y-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface border border-border text-xs font-mono text-accent">
        <span class="w-2 h-2 rounded-full bg-accent"></span>
        Programs Directory
      </div>
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-text">
        KuroLabs Programs
      </h1>
      <p class="text-base text-muted leading-relaxed">
        Programs are complete standalone applications engineered by KuroLabs. Each program has independent repositories, releases, and architectural boundaries.
      </p>
    </div>

    <!-- Filter & Search Bar -->
    <div class="surface-card p-4 mb-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-96">
        <input type="text" id="programs-search" placeholder="Search by name, technology, or keyword..." 
               class="input-control text-sm pl-9" aria-label="Search programs">
        <svg class="w-4 h-4 text-muted absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <span id="programs-count" class="text-xs font-mono text-muted">Loading programs...</span>
        <select id="programs-status-filter" class="input-control text-xs font-mono py-2 w-auto" aria-label="Filter by status">
          <option value="all">All Statuses</option>
          <option value="available">Available</option>
          <option value="in-development">In Development</option>
          <option value="planned">Planned</option>
        </select>
      </div>
    </div>

    <!-- Programs Grid -->
    <div id="programs-list" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="col-span-full py-16 text-center text-muted font-mono text-xs">
        Loading programs registry...
      </div>
    </div>

  </main>

  <!-- Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script type="module">
    import { renderNavbar } from '../js/components/navbar.js';
    import { renderFooter } from '../js/components/footer.js';
    import { initProgramsPage } from '../js/pages/programs.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('programs');
      renderFooter();
      initProgramsPage();
    });
  </script>
</body>
</html>
